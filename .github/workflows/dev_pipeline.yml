name: Universal CI Pipeline

on:
  push:
    branches: [ "dev", "feature/*" ]
  pull_request:
    branches: [ "test", "dev", "main" ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Syntax Check
      run: |
        # Compiles python files in the solver directory to check for syntax errors
        python -m compileall ./solver

    - name: Base Solver Smoke Test
      working-directory: ./solver
      run: |
        # Runs the solver on the default 'test_puzzle' logic without UI interaction
        # We explicitly run this inside the ./solver folder so it can find 'config/'
        python -c "from sudoku_solver import SudokuSolver; solver = SudokuSolver(config=None); print('Solving test_puzzle...'); success = solver.solve(); assert success, 'Solver failed to solve test_puzzle'"

    - name: Visualizer Smoke Test
      working-directory: ./solver
      run: |
        # Runs the visualizer's run method directly to bypass the 'input()' prompt
        # We explicitly run this inside the ./solver folder so it can find 'config/'
        python -c "from sudoku_visualizer import SudokuVisualizer; viz = SudokuVisualizer(); print('Visualizing test_puzzle...'); viz.run_visualizations('test_puzzle')"